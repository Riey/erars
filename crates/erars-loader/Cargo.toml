[package]
name = "erars-loader"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
erars-ast = { path = "../erars-ast" }
erars-bytecode = { path = "../erars-bytecode" }
erars-compiler = { path = "../erars-compiler" }
erars-lint = { path = "../erars-lint" }
erars-reader = { path = "../erars-reader" }
erars-ui = { path = "../erars-ui" }
erars-vm = { path = "../erars-vm" }

anyhow.workspace = true
hashbrown.workspace = true

rayon = { version = "1.5.3", optional = true }
codespan = "0.11.1"
codespan-reporting = "0.11.1"
serde_yaml = "0.9.13"
log = "0.4.17"
glob = "0.3.0"
parking_lot = "0.12.1"
rmp-serde = "1.1.1"
memmap2 = "0.5.7"

[dev-dependencies]
libc = "0.2"
mimalloc = { version = "0.1.31", default-features = false }
pprof = "0.15"

[features]
multithread = [
    "rayon",
    "hashbrown/rayon",
    "erars-vm/multithread",
    "erars-lint/multithread",
]

# `phases` is the load-pipeline measurement harness (per-phase timings, the
# function and interner counts). It uses `rayon` directly, so it only builds
# with `multithread`; a workspace-wide `cargo build` unifies the feature in
# from the front-end crates, but `-p erars-loader` alone would not.
[[example]]
name = "phases"
required-features = ["multithread"]
