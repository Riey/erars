[package]
name = "erars-vm"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
erars-ast = { path = "../erars-ast" }
erars-compiler = { path = "../erars-compiler" }
erars-font = { path = "../erars-font" }
erars-ui = { path = "../erars-ui" }

serde.workspace = true
strum.workspace = true
anyhow.workspace = true
enum-map.workspace = true
hashbrown.workspace = true
smallvec.workspace = true

bitflags = "1.3.2"
itertools = "0.10.3"
log = "0.4.14"
rayon = { version = "1.5.3", optional = true }
encoding_rs.workspace = true
rand = { version = "0.8.5", default-features = false, features = ["getrandom"] }
rand_chacha = { version = "0.3.1", default-features = false }
# 0.3.37 dropped the `num_threads::is_single_threaded()` gate on
# `local_offset_at`. Before it, `OffsetDateTime::now_local()` — and so GETTIME,
# GETTIMES and the whole save-description path — always failed with
# "The system's UTC offset could not be determined", because the VM never runs
# alone in the process.
time = { version = "0.3.37", features = ["local-offset", "serde"] }
css-color = "0.2.4"
regex = "1.6.0"
derivative = "2.2.0"
tinyvec = "1.6.0"
static_assertions = "1.1.0"
rmp-serde = "1.1.1"
flate2 = "1.0.25"
bytemuck = "1.13.0"
# GDI+ decodes whatever `Image.FromFile` recognises; the corpus ships `.webp`
# title art (`タイトル表示/PRINT_TITLE.ERB:50`) and `.jpg` event art.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "webp", "jpeg"] }

[dev-dependencies]
k9 = "0.11.5"
serde_yaml = "0.9"

[target.'wasm32-unknown-unknown'.dependencies]
getrandom = { version = "0.2.7", features = ["js"] }
time = { version = "0.3.37", features = ["wasm-bindgen"] }

[features]
multithread = ["rayon", "hashbrown/rayon"]
