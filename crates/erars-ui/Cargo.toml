[package]
name = "erars-ui"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
erars-ast = { path = "../erars-ast" }

anyhow.workspace = true
serde.workspace = true
encoding_rs.workspace = true

parking_lot = "0.12.1"
once_cell = "1.15.0"
regex = "1.6.0"
smol_str = { version = "0.2.0", features = ["serde"] }
log = "0.4.17"
time = "0.3.15"
bitflags = "2.3.1"
crossbeam-channel = "0.5.6"
serde_iter = "0.1.1"
# Pinned: the cell-width rule (spec Component 1) is defined against this
# table's East-Asian Width data. A newer table would silently move characters
# between 1 and 2 cells and break Emuera parity, so bump it deliberately.
unicode-width = "=0.1.11"

[dev-dependencies]
k9 = "0.11.5"
serde_json.workspace = true

[features]
