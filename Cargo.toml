[package]
name = "erars"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]
members = [
    "./crates/erars-ast",
    "./crates/erars-bytecode",
    "./crates/erars-compiler",
    "./crates/erars-renderer",
    "./crates/erars-proxy-system",
    "./crates/erars-reader",
    "./crates/erars-lexer",
    "./crates/erars-lint",
    "./crates/erars-loader",
    "./crates/erars-stdio",
    "./crates/erars-ui",
    "./crates/erars-vm",
]

[workspace.dependencies]
flume = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive", "phf"] }
thiserror = "1"
anyhow = "1"
logos = { version = "0.14", features = ["logos-derive"] }
hashbrown = { version = "0.15", features = ["serde"] }
enum-map = { version = "2", features = ["serde"] }

[dev-dependencies]
erars-ast = { path = "./crates/erars-ast" }
erars-lexer = { path = "./crates/erars-lexer" }
erars-compiler = { path = "./crates/erars-compiler" }
erars-ui = { path = "./crates/erars-ui" }
erars-vm = { path = "./crates/erars-vm" }

serde.workspace = true

codespan = "0.11.1"
codespan-reporting = "0.11.1"
criterion = "0.4.0"
k9 = "0.11.1"
glob = "0.3.0"
flexi_logger = "0.25.1"
log-panics = "2.1.0"
ron = "0.8.0"
log = "0.4.17"
serde_yaml = "0.9.13"
smol_str = "0.2.0"
mimalloc = { version = "0.1.31", default-features = false }

[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 1

[profile.test.build-override]
opt-level = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[profile.dev.build-override]
opt-level = 1

[profile.dev.package.swash]
opt-level = 3
debug = false

[profile.dev.package.cosmic-text]
opt-level = 3
debug = false

[profile.release-lto]
inherits = "release"
lto = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "save"
harness = false
